    provider: sim
    purpose: Classify synthetic internal intake notes into work queues.
    data_classes: [internal_ops, customer_pseudonym]
    risk_tier: medium
    approval_gates:
      - id: drafts-only
        kind: none
        required: false
        enforced_at: not_applicable
        effects_covered: []
