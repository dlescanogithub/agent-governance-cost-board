name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Pytest
        run: python -m pytest
      - name: Secret scan
        run: python -m governance_board secretscan
      - name: Policy on the synthetic fleet
        run: python -m governance_board policy --inventory inventory/fleet.yaml --prompts prompts/registry.yaml --today 2026-10-17
      - name: Violating inventory must fail
        run: |
          if python -m governance_board policy --inventory inventory/violating.yaml --prompts prompts/registry.yaml --today 2026-10-17; then
            echo "expected inventory/violating.yaml to fail policy"
            exit 1
          fi
      - name: Eval gate
        run: python -m governance_board eval
      - name: Forced eval regression must fail
        run: |
          if python -m governance_board eval-regression; then
            echo "expected eval-regression to fail"
            exit 1
          fi
